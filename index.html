<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Packaging · An Interactive Atlas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="brand">
    <span class="brand-mark">Advanced Packaging</span>
    <span class="brand-sub">an interactive atlas</span>
  </div>
  <div class="header-meta">v1.0 · Click components to explore</div>
</header>

<nav class="tabs" id="tabs"></nav>

<main>
  <section class="viewer">
    <div id="loading" class="loading">Loading 3D viewer…</div>

    <div class="viewer-title">
      <h1 id="view-title"></h1>
      <div class="subtitle" id="view-subtitle"></div>
    </div>

    <canvas id="three-canvas"></canvas>
    <div id="hover-tip"></div>

    <div class="layer-panel" id="layer-panel"></div>

    <div class="controls">
      <div class="control-card">
        <div class="control-label">
          <span>Exploded View</span>
          <span class="value" id="explode-value">0%</span>
        </div>
        <input type="range" id="explode-slider" min="0" max="1" step="0.01" value="0">
      </div>

      <div class="control-card">
        <div class="control-label">
          <span>Cross-Section</span>
          <span class="value" id="section-value">OFF</span>
        </div>
        <input type="range" id="section-slider" min="0" max="1" step="0.01" value="0">
      </div>

      <div class="control-card">
        <div class="control-label"><span>Camera View</span></div>
        <div class="presets">
          <button class="preset-btn active" data-preset="iso">Iso</button>
          <button class="preset-btn" data-preset="top">Top</button>
          <button class="preset-btn" data-preset="side">Side</button>
          <button class="preset-btn" data-preset="front">Front</button>
        </div>
      </div>
    </div>

    <div class="hint">drag to rotate · scroll to zoom · right-drag to pan</div>
  </section>

  <aside class="info-panel empty" id="info-panel"></aside>
</main>

<!-- Three.js from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<!-- Supabase (auth + data) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/data-store.js"></script>

<script src="data/packages.js"></script>
<script src="js/scene.js"></script>
<script src="js/app.js"></script>

</body>
</html>

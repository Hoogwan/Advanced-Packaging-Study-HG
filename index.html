<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Packaging · An Interactive Atlas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="brand">
    <span class="brand-mark">Advanced Packaging</span>
    <span class="brand-sub">an interactive atlas</span>
  </div>

  <nav class="view-nav" id="view-nav">
    <button class="view-nav-btn" data-view="overview">
      <span class="view-nav-num">00</span><span>Overview</span>
    </button>
    <button class="view-nav-btn" data-view="explorer">
      <span class="view-nav-num">01</span><span>3D Explorer</span>
    </button>
    <button class="view-nav-btn" data-view="applications">
      <span class="view-nav-num">02</span><span>Applications</span>
    </button>
    <button class="view-nav-btn" data-view="structure">
      <span class="view-nav-num">03</span><span>Structure Map</span>
    </button>
  </nav>

  <div class="header-meta">v1.1 · Click components to explore</div>
</header>

<!-- ============ VIEW: OVERVIEW (big-picture landing) ============ -->
<section class="app-view" id="view-overview">
  <div id="overview-root" class="overview-root"></div>
</section>

<!-- ============ VIEW: 3D EXPLORER (original app) ============ -->
<section class="app-view" id="view-explorer">
  <nav class="tabs" id="tabs"></nav>

  <main>
    <section class="viewer">
      <div id="loading" class="loading">Loading 3D viewer…</div>

      <div class="viewer-title">
        <h1 id="view-title"></h1>
        <div class="subtitle" id="view-subtitle"></div>
      </div>

      <canvas id="three-canvas"></canvas>
      <div id="hover-tip"></div>

      <div class="layer-panel" id="layer-panel"></div>

      <div class="controls">
        <div class="control-card">
          <div class="control-label">
            <span>Exploded View</span>
            <span class="value" id="explode-value">0%</span>
          </div>
          <input type="range" id="explode-slider" min="0" max="1" step="0.01" value="0">
        </div>

        <div class="control-card">
          <div class="control-label">
            <span>Cross-Section</span>
            <span class="value" id="section-value">OFF</span>
          </div>
          <input type="range" id="section-slider" min="0" max="1" step="0.01" value="0">
        </div>

        <div class="control-card">
          <div class="control-label"><span>Camera View</span></div>
          <div class="presets">
            <button class="preset-btn active" data-preset="iso">Iso</button>
            <button class="preset-btn" data-preset="top">Top</button>
            <button class="preset-btn" data-preset="side">Side</button>
            <button class="preset-btn" data-preset="front">Front</button>
          </div>
        </div>
      </div>

      <div class="hint">drag to rotate · scroll to zoom · right-drag to pan</div>
    </section>

    <aside class="info-panel empty" id="info-panel"></aside>
  </main>
</section>

<!-- ============ VIEW: APPLICATIONS ============ -->
<section class="app-view" id="view-applications">
  <div id="applications-root" class="applications-root"></div>
</section>

<!-- ============ VIEW: STRUCTURE MAP ============ -->
<section class="app-view" id="view-structure">
  <div id="structure-root" class="structure-root"></div>
</section>

<!-- Three.js from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<!-- Supabase (auth + data) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/data-store.js"></script>

<!-- Content data -->
<script src="data/packages.js"></script>
<script src="data/applications.js"></script>
<script src="data/structure-tree.js"></script>

<!-- 3D explorer -->
<script src="js/scene.js"></script>
<script src="js/app.js"></script>

<!-- New views (must load after app.js exposes window.AppNav) -->
<script src="js/overview-view.js"></script>
<script src="js/applications-view.js"></script>
<script src="js/tree-view.js"></script>

</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustrated package cross-section with a cleanroom engineer holding a wafer">
  <rect width="640" height="400" fill="#f4e8d4"/>
  <!-- soft washes -->
  <g opacity="0.55">
    <circle cx="120" cy="90" r="90" fill="#e9d3b0"/>
    <circle cx="300" cy="60" r="70" fill="#dfe6d6"/>
    <circle cx="560" cy="110" r="100" fill="#e4dbe8"/>
    <circle cx="420" cy="360" r="120" fill="#dbe7e6"/>
  </g>
  <!-- board -->
  <rect x="30" y="310" width="420" height="34" rx="10" fill="#6e8f6a"/>
  <rect x="30" y="310" width="420" height="10" rx="5" fill="#86a581" opacity="0.7"/>
  <!-- BGA balls -->
  <g fill="#b9bab3" stroke="#8f918a" stroke-width="1.2">
    <circle cx="68" cy="299" r="10"/><circle cx="98" cy="299" r="10"/><circle cx="128" cy="299" r="10"/><circle cx="158" cy="299" r="10"/>
    <circle cx="188" cy="299" r="10"/><circle cx="218" cy="299" r="10"/><circle cx="248" cy="299" r="10"/><circle cx="278" cy="299" r="10"/>
    <circle cx="308" cy="299" r="10"/><circle cx="338" cy="299" r="10"/><circle cx="368" cy="299" r="10"/><circle cx="398" cy="299" r="10"/>
  </g>
  <!-- substrate -->
  <rect x="50" y="258" width="380" height="31" rx="8" fill="#a9b98a"/>
  <path d="M60 268 H420 M60 278 H420" stroke="#c99a5b" stroke-width="1.6" opacity="0.7"/>
  <!-- C4 -->
  <g fill="#c7c8c1">
    <circle cx="96" cy="253" r="5"/><circle cx="116" cy="253" r="5"/><circle cx="136" cy="253" r="5"/><circle cx="156" cy="253" r="5"/>
    <circle cx="176" cy="253" r="5"/><circle cx="196" cy="253" r="5"/><circle cx="216" cy="253" r="5"/><circle cx="236" cy="253" r="5"/>
    <circle cx="256" cy="253" r="5"/><circle cx="276" cy="253" r="5"/><circle cx="296" cy="253" r="5"/><circle cx="316" cy="253" r="5"/>
    <circle cx="336" cy="253" r="5"/><circle cx="356" cy="253" r="5"/><circle cx="376" cy="253" r="5"/><circle cx="396" cy="253" r="5"/>
  </g>
  <!-- interposer + TSVs -->
  <rect x="86" y="232" width="320" height="16" rx="4" fill="#8ea3b4"/>
  <path d="M120 232 V248 M160 232 V248 M200 232 V248 M240 232 V248 M280 232 V248 M320 232 V248 M360 232 V248" stroke="#c58b4b" stroke-width="2.4"/>
  <!-- µbumps -->
  <path d="M96 228 H398" stroke="#c58b4b" stroke-width="5" stroke-dasharray="3 4" stroke-linecap="round"/>
  <!-- 3D stack: base die / bond / top die -->
  <rect x="100" y="196" width="96" height="28" rx="4" fill="#a4553c"/>
  <rect x="100" y="192" width="96" height="4" fill="#e0b84a"/>
  <rect x="100" y="166" width="96" height="26" rx="4" fill="#d08a66"/>
  <path d="M116 196 V224 M136 196 V224 M156 196 V224 M176 196 V224" stroke="#c58b4b" stroke-width="2" opacity="0.8"/>
  <!-- GPU -->
  <rect x="206" y="188" width="72" height="36" rx="4" fill="#c9805f"/>
  <!-- HBM stacks -->
  <g>
    <rect x="288" y="128" width="54" height="96" rx="4" fill="#3f5a78"/>
    <path d="M288 140 H342 M288 152 H342 M288 164 H342 M288 176 H342 M288 188 H342 M288 200 H342 M288 212 H342" stroke="#6f8aa6" stroke-width="1.6"/>
    <rect x="350" y="128" width="54" height="96" rx="4" fill="#3f5a78"/>
    <path d="M350 140 H404 M350 152 H404 M350 164 H404 M350 176 H404 M350 188 H404 M350 200 H404 M350 212 H404" stroke="#6f8aa6" stroke-width="1.6"/>
  </g>
  <!-- light: a fiber leaving the package -->
  <path d="M404 150 C440 150 452 120 492 112 S560 116 600 96" fill="none" stroke="#e0b84a" stroke-width="4" stroke-linecap="round"/>
  <path d="M404 150 C440 150 452 120 492 112 S560 116 600 96" fill="none" stroke="#fff6d8" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2 10"/>
  <!-- engineer -->
  <svg x="458" y="176" width="168" height="168" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="eng-wafer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9e6ea"/>
      <stop offset="0.5" stop-color="#9fbcc6"/>
      <stop offset="1" stop-color="#c9b8d8"/>
    </linearGradient>
    <clipPath id="eng-wafer-clip"><circle cx="32" cy="49" r="10.5"/></clipPath>
  </defs>
  <!-- bunny suit body -->
  <path d="M12.5 64 C12.5 47 19.5 39.5 32 39.5 C44.5 39.5 51.5 47 51.5 64 Z" fill="#f7f6f2" stroke="#232a33" stroke-width="2" stroke-linejoin="round"/>
  <!-- hood -->
  <path d="M32 6.5 C42.5 6.5 48 14 48 23.5 C48 33 41.5 40 32 40 C22.5 40 16 33 16 23.5 C16 14 21.5 6.5 32 6.5 Z" fill="#f7f6f2" stroke="#232a33" stroke-width="2"/>
  <path d="M32 7 V12" stroke="#232a33" stroke-width="1.4" stroke-linecap="round"/>
  <!-- face opening -->
  <rect x="21" y="15.5" width="22" height="16" rx="8" fill="#f3d2b6" stroke="#232a33" stroke-width="1.6"/>
  <!-- eyes -->
  <ellipse cx="27.3" cy="20.6" rx="1.7" ry="2" fill="#232a33"/>
  <ellipse cx="36.7" cy="20.6" rx="1.7" ry="2" fill="#232a33"/>
  <circle cx="27.9" cy="19.9" r="0.6" fill="#fff"/>
  <circle cx="37.3" cy="19.9" r="0.6" fill="#fff"/>
  <!-- face mask -->
  <path d="M21.6 24.2 H42.4 V27 C42.4 29.6 40.3 31.2 37.8 31.2 H26.2 C23.7 31.2 21.6 29.6 21.6 27 Z" fill="#bcd6e0" stroke="#232a33" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M25.5 27.4 H38.5" stroke="#232a33" stroke-width="0.9" stroke-linecap="round" opacity="0.45"/>
  <!-- wafer -->
  <circle cx="32" cy="49" r="10.5" fill="url(#eng-wafer)" stroke="#232a33" stroke-width="1.8"/>
  <g clip-path="url(#eng-wafer-clip)" stroke="#ffffff" stroke-width="0.8" opacity="0.85">
    <path d="M24 38 V60 M28 38 V60 M32 38 V60 M36 38 V60 M40 38 V60"/>
    <path d="M20 41 H44 M20 45 H44 M20 49 H44 M20 53 H44 M20 57 H44"/>
  </g>
  <path d="M30.4 59.4 L32 57.9 L33.6 59.4" fill="none" stroke="#232a33" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- gloved hands -->
  <circle cx="21.6" cy="49.5" r="3.4" fill="#bcd6e0" stroke="#232a33" stroke-width="1.6"/>
  <circle cx="42.4" cy="49.5" r="3.4" fill="#bcd6e0" stroke="#232a33" stroke-width="1.6"/>
</svg>
</svg>
